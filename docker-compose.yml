version: "3.9"

services:
  # ── Main Application ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-demo-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - APP_VERSION=2.0.0
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  # ── Development Mode ─────────────────────────────────────────
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-demo-dev
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app  # Hot reload for development
    profiles:
      - dev  # Only starts with: docker compose --profile dev up
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
